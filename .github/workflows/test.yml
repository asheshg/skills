name: Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r skills/first-draft/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/website-competitor-analysis/scripts/validate_manifest.py --self-test
      - run: python scripts/inspect_first_draft_assets.py review-artifacts/asset-inventory.json
